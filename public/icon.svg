<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Outer Zen Focus Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#glow)" stroke-width="14" stroke-dasharray="16 12" opacity="0.85" />
  <circle cx="256" cy="256" r="142" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.25" />

  <!-- Center Snowflake / Book Motif -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- 6-ray snow crystal branches -->
    <line x1="0" y1="-80" x2="0" y2="80" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="-69.28" y1="-40" x2="69.28" y2="40" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />
    <line x1="-69.28" y1="40" x2="69.28" y2="-40" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />

    <!-- Branch chevrons -->
    <path d="M-22 -55 L0 -72 L22 -55" fill="none" stroke="url(#glow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-22 55 L0 72 L22 55" fill="none" stroke="url(#glow)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Core Zen dot -->
    <circle cx="0" cy="0" r="18" fill="url(#glow)" />
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
  </g>

  <!-- Typography: 雪穗 -->
  <text x="256" y="445" font-family="sans-serif" font-size="34" font-weight="600" fill="#cbd5e1" text-anchor="middle" letter-spacing="8">雪穗自习室</text>
</svg>
